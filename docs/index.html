/* UN SDG guidelines, September 2023: p. 11 (white/light grey), p. 68
   (17 goal colours and logo blue). Use RGB values, not sampled image colours.
   https://www.un.org/sustainabledevelopment/wp-content/uploads/2023/09/E_SDG_Guidelines_Sep20238.pdf */
:root{color-scheme:light;--paper:#ffffff;--ink:#000000;--blue:#009edb}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
/* On desktop, match the wheel to the three tile rows: the grid has 40px
   horizontal padding and five 16px gaps. Account for the SVG ring inset too.
   Smaller screens retain a viewport-bounded strip and an uncropped circle. */
.wheel-strip{--strip-height:clamp(280px,60svh,520px);height:var(--strip-height);width:100%;margin:0;padding:16px;display:grid;place-items:center;background:var(--paper)}
.wheel-wrap{position:relative;width:min(100%,calc(var(--strip-height) - 32px));aspect-ratio:1}
.wheel{display:block;width:100%;height:auto}
.wheel-title{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.wheel-title h1{margin:0;width:31%;line-height:0}
.goal-tiles{--columns:6;--gap:16px;max-width:1240px;margin:0 auto;padding:40px 20px 60px;list-style:none;display:flex;flex-wrap:wrap;justify-content:center;gap:var(--gap)}
/* Reserve 1.5 heading lines so icon centering sits between one- and two-line titles. */
.goal-tile{flex:0 0 calc((100% - (var(--columns) - 1)*var(--gap))/var(--columns));min-width:0;container-type:inline-size;aspect-ratio:1;color:white;padding:0;position:relative;perspective:900px}
.goal-tile h2{font-family:WheelWordmark,Arial,sans-serif;font-weight:900;font-size:clamp(.75rem,9cqw,1.25rem);line-height:1.08;text-transform:uppercase;margin:0;letter-spacing:-.02em}
.goal-tile svg{display:block;width:54%;height:auto;aspect-ratio:1;margin:auto;flex-shrink:0}
.wheel-tile{--goal-color:#f1f1f1}.wheel-tile .card-front,.wheel-tile .card-back{display:none}.wheel-tile .card-rotor{display:flex;padding:18px;align-items:center;justify-content:center;background:var(--goal-color)}.wheel-tile svg{width:82%;margin:0}

html{-webkit-user-select:none;user-select:none}
.goal-card{display:block;width:100%;height:100%;border:0;padding:0;background:transparent;color:inherit;text-align:left;cursor:pointer;font:inherit;perspective:900px}
.goal-card:focus-visible{outline:3px solid var(--blue);outline-offset:4px}
.card-rotor{display:block;position:absolute;inset:0;transform-style:preserve-3d;transform:rotateY(var(--turn,0deg));transition:transform 450ms ease}
.card-front,.card-back{position:absolute;inset:0;padding:18px;background:var(--goal-color);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.card-front{display:grid;grid-template-rows:clamp(1.215rem,14.58%,2.025rem) minmax(0,1fr)}
.card-back{transform:rotateY(180deg);display:flex;flex-direction:column;justify-content:center;gap:.7em;font-size:clamp(.65rem,6.5cqw,.9rem);line-height:1.35;overflow:hidden;cursor:pointer}

.rotation-surface{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;pointer-events:none}.wheel-leaf{pointer-events:visiblePainted}.rotation-surface.dragging{cursor:grabbing}
.symbol-library{position:absolute;width:0;height:0;overflow:hidden}
@media(min-width:1001px){.wheel-strip{--grid-width:min(100vw,1240px);--strip-height:calc(((var(--grid-width) - 120px)/2 + 32px)*720/676 + 32px)}}
@media(max-width:1000px){.goal-tiles{--columns:3}}
@media(max-width:760px){.goal-tiles{--columns:3;--gap:12px;padding:24px 16px 40px}.card-front,.card-back,.wheel-tile .card-rotor{padding:14px}}
@media(max-width:520px){.goal-tiles{--columns:2}.card-front,.card-back,.wheel-tile .card-rotor{padding:12px}}
@media print{.wheel-strip{--strip-height:360px}.goal-tiles{--columns:4;padding:20px 0}.goal-tile{break-inside:avoid}body{print-color-adjust:exact}}
</style>
</head>
<body>
<main>
<figure class="wheel-strip">
<div class="wheel-wrap">
<svg class="wheel" viewBox="0 0 720 720" role="img" aria-labelledby="wheel-label wheel-description">
<title id="wheel-label">Seventeen sustainable software development goals</title>
<desc id="wheel-description">A ring of seventeen coloured segments, each with its own white symbol. Read clockwise from the top; the tiles below name each goal. Drag any wheel to spin all three together; press a wheel to stop the spin.</desc>
<g id="segments"></g>
</svg>
<div class="wheel-title"><h1 aria-label="Sustainable software development goals">
<svg viewBox="0 0 240 182" aria-hidden="true" style="width:100%;height:auto;overflow:visible;font-family:WheelWordmark,Arial,sans-serif;font-weight:900">
<g fill="var(--blue)" font-size="40">
<text x="0" y="29" textLength="240" lengthAdjust="spacingAndGlyphs">SUSTAINABLE</text>
<text x="0" y="75" font-size="60" textLength="240" lengthAdjust="spacingAndGlyphs">SOFTWARE</text>
<text x="0" y="107" textLength="240" lengthAdjust="spacingAndGlyphs">DEVELOPMENT</text>
</g>
<g fill="var(--blue)" font-size="91">
<text x="0" y="180" textLength="49" lengthAdjust="spacingAndGlyphs">G</text>
<text x="122" y="180" textLength="118" lengthAdjust="spacingAndGlyphs">ALS</text>
</g>
<svg x="51" y="114" width="68" height="68" viewBox="0 0 720 720"><g id="wordmark-wheel"><g id="colour-ring"></g></g></svg>
</svg>
</h1></div>
</div>
</figure>
<ol class="goal-tiles" id="goal-tiles" aria-label="Software development goals"></ol>
<noscript><p>Enable JavaScript to display the goal wheel and its goal tiles.</p></noscript>
</main>
<svg class="symbol-library" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs id="symbols"></defs></svg>
<script src="tile-interactions.js"></script>
<script>
// One record supplies each segment and its goal tile. Icons use a shared
// 32-unit drawing space; the wheel keeps them upright for easy recognition.
let goals;
const artworkReady=fetch('goals.json').then(response=>{
 if(!response.ok)throw new Error('Could not load goal data: '+response.status);
 return response.json();
}).then(data=>{goals=data;initializeArtwork();});
const svgNS='http://www.w3.org/2000/svg';
// Shared icon canvas: 2-unit strokes stay inside a 2-unit exterior safe zone.
const iconViewBox='0 0 32 32';
const iconMarkup = id => `<svg viewBox="${iconViewBox}" aria-hidden="true"><use href="#icon-${id}"/></svg>`;
const symbols=document.getElementById('symbols');
const segments=document.getElementById('segments');
const tiles=document.getElementById('goal-tiles');
const point=(radius,angle)=>[360+radius*Math.cos(angle),360+radius*Math.sin(angle)];
// Radial drag and release inertia follow bolt-spec-v0's
// useBoltFigureRotationInteractions (revision 7a2edc51d2744f54e9aedc8d700e1091a297587d).
// This wheel follows the pointer 1:1, has no socket snapping, and shares one
// angle across all wheels; the wordmark rotates in the opposite direction.
const wheelSettings={
 keepIconsUpright:true,
 inertiaRetentionPerMs:.9945,
 minimumCoastSpeed:.015, // Degrees per millisecond.
 maximumFrameMs:64,
 dragThresholdPx:8,
 centreDeadRadiusPx:18,
 centreDeadRadiusRatio:.12,
 minimumAngleDelta:.001,
 sampleWindowMs:180,
 releaseWindowMs:160,
};
let rotationSurfaces,wheelIcons,wheelTile;
let rotation=0,drag=null,coastFrame=null;
function renderRotation(){
 const angle=((rotation%360)+360)%360;
 segments.setAttribute('transform',`rotate(${angle} 360 360)`);
 for(const {icon,x,y} of wheelIcons)icon.setAttribute('transform',`rotate(${wheelSettings.keepIconsUpright?-angle:0} ${x} ${y})`);
 document.getElementById('wordmark-wheel').setAttribute('transform',`rotate(${-angle} 360 360)`);
 document.getElementById('tile-wheel').setAttribute('transform',`rotate(${angle} 360 360)`);
}
function stopCoasting(){
 if(coastFrame!==null)cancelAnimationFrame(coastFrame);
 coastFrame=null;
}
function releaseDrag(){
 const ended=drag;
 drag=null;
 if(!ended)return;
 ended.surface.classList.remove('dragging');
 if(ended.capture.hasPointerCapture(ended.id))ended.capture.releasePointerCapture(ended.id);
}
function stopRotation(){stopCoasting();releaseDrag();}
function coast(velocity){
 if(Math.abs(velocity)<wheelSettings.minimumCoastSpeed)return;
 let previous=performance.now();
 const tick=now=>{
  const elapsed=Math.min(now-previous,wheelSettings.maximumFrameMs);
  previous=now;
  const decay=Math.pow(wheelSettings.inertiaRetentionPerMs,elapsed);
  rotation+=velocity*(1-decay)/-Math.log(wheelSettings.inertiaRetentionPerMs);
  velocity*=decay;
  renderRotation();
  coastFrame=Math.abs(velocity)<wheelSettings.minimumCoastSpeed?null:requestAnimationFrame(tick);
 };
 coastFrame=requestAnimationFrame(tick);
}
function pointerAngle(event,gesture){
 const x=event.clientX-gesture.cx,y=event.clientY-gesture.cy;
 // Ignore the centre, where small pointer movements cause large angle jumps.
 return Math.hypot(x,y)<gesture.deadRadius?null:Math.atan2(y,x)*180/Math.PI;
}
window.addEventListener('blur',stopRotation);
window.addEventListener('resize',stopRotation);
window.addEventListener('scroll',()=>{if(drag)stopRotation();},{capture:true,passive:true});
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopRotation();});
function createTileCard(label){
 const button=document.createElement('button');
 button.className='goal-card';button.type='button';
 button.setAttribute('aria-expanded','false');button.setAttribute('aria-label',label);
 button.innerHTML='<span class="card-rotor"><span class="card-front"></span><span class="card-back" aria-hidden="true"></span></span>';
 return {button,front:button.querySelector('.card-front'),back:button.querySelector('.card-back')};
}
function initializeArtwork(){
const step=2*Math.PI/goals.length;
const gap=.035;
for(const [index,goal] of goals.entries()){
 const symbol=document.createElementNS(svgNS,'symbol');
 symbol.id=`icon-${goal.id}`;
 symbol.setAttribute('viewBox',iconViewBox);
 symbol.innerHTML=`<g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${goal.icon}</g>`;
 symbols.append(symbol);
 const start=-Math.PI/2+index*step+gap/2;
 const end=-Math.PI/2+(index+1)*step-gap/2;
 const middle=(start+end)/2;
 const outerStart=point(338,start),outerEnd=point(338,end);
 const innerStart=point(188,start),innerEnd=point(188,end);
 const [x,y]=point(263,middle);
 const group=document.createElementNS(svgNS,'g');
 group.dataset.goal=goal.id;
 group.innerHTML=`<path class="wheel-leaf" id="sector-${goal.id}" fill="${goal.color}" d="M${outerStart} A338 338 0 0 1 ${outerEnd} L${innerEnd} A188 188 0 0 0 ${innerStart} Z"/><use href="#icon-${goal.id}" x="${x-26}" y="${y-26}" width="52" height="52" color="white" pointer-events="none"/>`;
 segments.append(group);
 // Reuse the actual wheel sectors for the O, without the full-size icons.
 const sector=document.createElementNS(svgNS,'use');
 sector.setAttribute('href',`#sector-${goal.id}`);
 document.getElementById('colour-ring').append(sector);
 const item=document.createElement('li');
 item.className='goal-tile';
 item.style.setProperty('--goal-color',goal.color);
 const card=createTileCard(goal.name);
 card.front.innerHTML=`<h2></h2>${iconMarkup(goal.id)}`;
 card.front.querySelector('h2').textContent=goal.name;
 card.back.innerHTML='<span class="explanation"></span>';
 card.back.firstElementChild.textContent=goal.explanation;
 tileInteractions.flip(card.button,card);
 item.append(card.button);
 tiles.append(item);
}
// The eighteenth tile completes the grid with the same unlabelled colour wheel.
wheelTile=document.createElement('li');
wheelTile.className='goal-tile wheel-tile';
const wheelCard=createTileCard('Sustainable software development goals colour wheel');
wheelCard.button.querySelector('.card-rotor').insertAdjacentHTML('beforeend','<svg viewBox="0 0 720 720" aria-hidden="true"><g id="tile-wheel"><use href="#colour-ring"/></g></svg>');
wheelTile.append(wheelCard.button);
tileInteractions.flip(wheelCard.button,{...wheelCard,gestureTarget:wheelTile,dragThreshold:wheelSettings.dragThresholdPx});
tiles.append(wheelTile);

 wheelIcons=[...segments.querySelectorAll('use')].map(icon=>({icon,x:icon.x.baseVal.value+icon.width.baseVal.value/2,y:icon.y.baseVal.value+icon.height.baseVal.value/2}));
 rotationSurfaces=[document.querySelector('.wheel'),document.querySelector('.wheel-title svg svg'),wheelTile.querySelector('svg')];
for(const surface of rotationSurfaces){
 surface.classList.add('rotation-surface');
 const capture=surface.closest('.wheel-wrap,.wheel-tile');
 surface.addEventListener('pointerdown',event=>{
  if(event.button!==0||!event.isPrimary||drag)return;
  stopCoasting();
  const rect=surface.getBoundingClientRect();
  drag={surface,capture,direction:surface===rotationSurfaces[1]?-1:surface.closest('.goal-card')?.getAttribute('aria-expanded')==='true'?-1:1,id:event.pointerId,cx:rect.x+rect.width/2,cy:rect.y+rect.height/2,
   deadRadius:Math.min(wheelSettings.centreDeadRadiusPx,rect.width*wheelSettings.centreDeadRadiusRatio),x:event.clientX,y:event.clientY,
   active:false,last:null,samples:[{time:performance.now(),angle:rotation}]};
  drag.last=pointerAngle(event,drag);
  capture.setPointerCapture(event.pointerId);
  event.preventDefault();
 });
 const movePointer=event=>{
  if(!drag||drag.id!==event.pointerId||drag.surface!==surface)return;
  if(!drag.active){
   if(Math.hypot(event.clientX-drag.x,event.clientY-drag.y)<wheelSettings.dragThresholdPx)return;
   drag.active=true;
   surface.classList.add('dragging');
  }
  const next=pointerAngle(event,drag);
  if(next===null||drag.last===null){
   drag.last=next;
   drag.samples=[];
   return;
  }
  const delta=((next-drag.last+540)%360)-180;
  if(Math.abs(delta)<wheelSettings.minimumAngleDelta)return;
  rotation+=delta*drag.direction;
  drag.last=next;
  const now=performance.now();
  drag.samples=drag.samples.filter(sample=>now-sample.time<=wheelSettings.sampleWindowMs);
  drag.samples.push({time:now,angle:rotation});
  renderRotation();
 };
 capture.addEventListener('pointermove',movePointer);
 capture.addEventListener('pointerup',event=>{
  if(!drag||drag.id!==event.pointerId||drag.surface!==surface)return;
  // Browsers may coalesce the last move; consume the final release position.
  movePointer(event);
  const now=performance.now();
  const samples=drag.samples.filter(sample=>now-sample.time<=wheelSettings.releaseWindowMs);
  // Match Bolt: estimate speed between recent movement samples. The release
  // window discards stale movement; pointer-up latency does not dilute speed.
  const first=samples[0],last=samples.at(-1);
  const velocity=drag.active&&first&&last.time>first.time?(last.angle-first.angle)/(last.time-first.time):0;
  releaseDrag();
  coast(velocity);
 });
 for(const type of ['pointercancel','lostpointercapture'])capture.addEventListener(type,event=>{
  if(drag?.id===event.pointerId&&drag.surface===surface)stopRotation();
 });
}
 renderRotation();
}

</script>
</body>
</html>
